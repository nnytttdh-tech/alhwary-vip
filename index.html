<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الهواري شات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="auth" class="sky">
  <div class="stars"></div>
  <div class="beam"></div>
  <div class="auth-card">
    <div class="descend">
      <div class="orb"></div>
    </div>
    <h1 class="brand-title">الهواري شات</h1>
    <p class="brand-sub">مساحتك للكلام والمنشورات في مكان واحد</p>

    <div class="tabs mini">
      <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
      <button id="tabRegisterBtn" class="tab-btn" onclick="switchAuthTab('register')">حساب جديد</button>
    </div>

    <div id="loginForm" class="auth-form">
      <input id="loginUsername" placeholder="اليوزر" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="الباسورد" autocomplete="current-password">
      <button class="glow-btn" onclick="login()">دخول</button>
    </div>

    <div id="registerForm" class="auth-form hidden">
      <input id="regDisplayName" placeholder="اسمك الظاهر">
      <input id="regUsername" placeholder="username" maxlength="24" autocomplete="username">
      <input id="regPassword" type="password" placeholder="الباسورد (6 أحرف على الأقل)" autocomplete="new-password">
      <button class="glow-btn" onclick="register()">إنشاء الحساب</button>
      <small>اليوزر: حروف إنجليزية صغيرة وأرقام و _ فقط</small>
    </div>

    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand"><span class="logo small">هـ</span><b>الهواري شات</b></div>
    <div class="switch">
      <button id="switchFace" class="switch-btn active" onclick="switchSection('face')">📷 فيس</button>
      <button id="switchWats" class="switch-btn" onclick="switchSection('wats')">💬 واتس</button>
    </div>
    <div class="me" id="me"></div>
  </div>

  <!-- ---- قسم فيس ---- -->
  <div id="faceSection" class="section">
    <div class="face-wrap">
      <div class="stories-bar" id="storiesBar"></div>

      <div class="composer-card">
        <textarea id="postText" placeholder="بتفكر في إيه؟"></textarea>
        <div id="postPreview" class="img-preview hidden"><img id="postPreviewImg"><button onclick="clearPostImage()">✕</button></div>
        <div class="composer-actions">
          <label class="pick-img">🖼️ صورة<input type="file" accept="image/*" id="postImageInput" onchange="onPickImage(event,'post')"></label>
          <label class="pick-img story-pick">✨ حالة<input type="file" accept="image/*" id="storyImageInput" onchange="onPickImage(event,'story')"></label>
          <button class="glow-btn small" onclick="submitPost()">نشر</button>
        </div>
      </div>

      <div id="feed"></div>
    </div>
  </div>

  <!-- ---- قسم واتس ---- -->
  <div id="watsSection" class="section hidden">
    <aside>
      <div class="search">
        <input id="search" placeholder="ابحث باليوزر..." oninput="searchUsers()">
        <div id="results"></div>
      </div>

      <div class="wats-tabs">
        <button class="wt active" data-wt="chats" onclick="setWatsTab('chats')">محادثات</button>
        <button class="wt" data-wt="groups" onclick="setWatsTab('groups')">مجموعات</button>
        <button class="wt" data-wt="channels" onclick="setWatsTab('channels')">قنوات</button>
      </div>

      <div id="watsChats" class="wt-panel"></div>

      <div id="watsGroups" class="wt-panel hidden">
        <button class="new-item" onclick="createGroup()">＋ إنشاء مجموعة</button>
        <div id="groupsList"></div>
      </div>

      <div id="watsChannels" class="wt-panel hidden">
        <button class="new-item" onclick="createChannel()">＋ إنشاء قناة</button>
        <div id="channelsList"></div>
        <h4>اكتشف قنوات</h4>
        <div id="channelsDiscover"></div>
      </div>
    </aside>

    <main>
      <header id="chatHeader">
        <div>
          <b>اختر محادثة</b>
          <small>ابحث عن صديق باليوزر وابدأ الكلام</small>
        </div>
      </header>
      <section id="messages"></section>
      <form id="sendForm" class="composer">
        <input id="message" autocomplete="off" placeholder="اكتب رسالة..." disabled>
        <button disabled>إرسال</button>
      </form>
    </main>
  </div>
</div>

<div id="storyViewer" class="story-viewer hidden" onclick="closeStory(event)">
  <div class="story-box">
    <div class="story-head" id="storyHead"></div>
    <div id="storyBody"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
